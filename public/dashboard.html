<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f1ece0">
<script>(()=>{try{const ui=JSON.parse(localStorage.getItem("vocabularyLearner.ui.v1")||"{}");document.documentElement.dataset.theme=ui.theme==="dark"?"dark":"light"}catch{document.documentElement.dataset.theme="light"}})();</script><title>Dashboard · GRE Vocab Machine</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app-shell"><header class="topbar"><a class="brand" href="index.html" style="color:inherit;text-decoration:none"><span class="brand-mark">V</span><div><h1>GRE Vocab Machine</h1><p>Your learning dashboard</p></div></a><nav class="site-nav"><a href="index.html">Study</a><a href="review.html">Review</a><a href="dashboard.html">Dashboard</a><a href="game.html">Game</a></nav><div class="top-actions"><div id="account-menu-wrap" style="position:relative"><button id="account-button" class="button-secondary account-button" type="button">Sign in</button><div id="account-menu" class="feature-card" style="display:none;position:absolute;right:0;top:calc(100% + 8px);z-index:5;min-width:150px;padding:12px"><button id="sign-out-button" class="button-secondary" type="button">Sign out</button></div></div><button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Switch to dark mode" title="Switch to dark mode"><span class="theme-toggle-track" aria-hidden="true"><span class="theme-icon theme-icon-sun"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg></span><span class="theme-toggle-thumb"></span><span class="theme-icon theme-icon-moon"><svg viewBox="0 0 24 24"><path d="M20.2 15.4A8.5 8.5 0 0 1 8.6 3.8 8.5 8.5 0 1 0 20.2 15.4Z"></path></svg></span></span></button></div></header>
<section class="feature-page"><div class="feature-header"><div><h2>Your progress</h2><p>A clear view of your vocabulary learning and game history.</p></div><a class="button-secondary" href="index.html">Back to flashcards</a></div><div id="dashboard-content"><p class="feature-muted">Loading your dashboard…</p></div></section></main>
<script>
(async()=>{const root=document.querySelector('#dashboard-content');const req=async(url,options={})=>{const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||'Request failed'),{status:r.status});return d;};try{const me=await req('/api/me');if(!me.user){root.innerHTML='<div class="feature-empty"><h3>Sign in to view your dashboard</h3><p>Your progress is saved privately to your account.</p><a class="button-primary" href="index.html?auth=login">Sign in</a></div>';return;}const d=await req('/api/dashboard');const pct=d.totalWords?Math.round(d.learned/d.totalWords*100):0;root.innerHTML='<div class="stat-grid"><div class="stat-card"><span>Total dictionary words</span><strong>'+d.totalWords.toLocaleString()+'</strong></div><div class="stat-card"><span>In review</span><strong>'+d.review.toLocaleString()+'</strong></div><div class="stat-card"><span>Learned</span><strong>'+d.learned.toLocaleString()+'</strong></div><div class="stat-card"><span>Not marked</span><strong>'+d.unmarked.toLocaleString()+'</strong></div></div><article class="feature-card" style="margin-top:18px"><div style="display:flex;justify-content:space-between;gap:12px"><strong>Learned progress</strong><span>'+pct+'%</span></div><div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div><p class="feature-muted">'+d.learned+' of '+d.totalWords+' words marked learned.</p><div class="feature-actions"><a href="review.html">Review words</a><a href="game.html">Play matching game</a><button id="reset-progress">Reset learning progress</button></div></article><article class="feature-card"><h3 style="margin-top:0">Game history</h3><p class="feature-muted">Games completed: '+d.gameCount+'</p><p class="feature-muted">Best score: '+(d.bestGame?d.bestGame.score+' points ('+d.bestGame.accuracy+'%)':'No games played yet')+'</p><div id="recent-games"></div></article>';const recent=document.querySelector('#recent-games');if(d.recentGames.length){const ul=document.createElement('div');d.recentGames.forEach(g=>{const row=document.createElement('p');row.className='feature-muted';row.textContent=new Date(g.completedAt).toLocaleString()+' · '+g.score+' points · '+g.correct+'/'+g.totalQuestions+' correct';ul.append(row);});recent.append(ul);}document.querySelector('#reset-progress').addEventListener('click',async()=>{if(!confirm('Reset all your review and learned statuses? Your personal notes will be preserved.'))return;try{await req('/api/progress',{method:'DELETE',body:JSON.stringify({confirm:'RESET_MY_PROGRESS'})});alert('Your review and learned statuses have been reset.');location.reload();}catch(e){alert(e.message);}});}catch(e){root.innerHTML='<div class="feature-empty"><h3>Could not load dashboard</h3><p>'+e.message+'</p></div>';}})();
</script><script>
(async()=>{const button=document.getElementById('account-button'),menu=document.getElementById('account-menu'),logout=document.getElementById('sign-out-button');const req=async(url,options={})=>{const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d};try{const me=await req('/api/me');if(me.user){button.textContent=me.user.username||me.user.email;button.title='Account options';button.onclick=()=>{menu.style.display=menu.style.display==='block'?'none':'block'};logout.onclick=async()=>{try{await req('/api/auth/logout',{method:'POST',body:'{}'})}finally{location.reload()}}}else{button.textContent='Sign in';button.onclick=()=>location.href='index.html?auth=login';menu.remove()}}catch{button.textContent='Sign in';button.onclick=()=>location.href='index.html?auth=login';menu.remove()}
const toggle=document.getElementById('theme-toggle');function applyTheme(theme,persist=true){document.documentElement.dataset.theme=theme;const dark=theme==='dark';toggle.setAttribute('aria-checked',String(dark));toggle.setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode');toggle.title=dark?'Switch to light mode':'Switch to dark mode';const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=dark?'#171818':'#f1ece0';if(persist){let ui={};try{ui=JSON.parse(localStorage.getItem('vocabularyLearner.ui.v1')||'{}')}catch{}localStorage.setItem('vocabularyLearner.ui.v1',JSON.stringify({...ui,theme}))}}applyTheme(document.documentElement.dataset.theme||'light',false);toggle.addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));
})();
</script><script>(()=>{if(window.matchMedia?.("(pointer: coarse)").matches)return;let raf=0,x=window.innerWidth*0.5,y=window.innerHeight*0.2;const update=()=>{document.documentElement.style.setProperty("--cursor-x",x+"px");document.documentElement.style.setProperty("--cursor-y",y+"px");document.body.classList.add("cursor-glow-visible");raf=0};window.addEventListener("pointermove",e=>{x=e.clientX;y=e.clientY;if(!raf)raf=requestAnimationFrame(update)},{passive:true});window.addEventListener("pointerleave",()=>{document.body.classList.remove("cursor-glow-visible")})})();</script></body></html>

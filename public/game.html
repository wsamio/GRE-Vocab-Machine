<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f1ece0">
<script>(()=>{try{const ui=JSON.parse(localStorage.getItem("vocabularyLearner.ui.v1")||"{}");document.documentElement.dataset.theme=ui.theme==="dark"?"dark":"light"}catch{document.documentElement.dataset.theme="light"}})();</script><title>Matching Game · GRE Vocab Machine</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app-shell"><header class="topbar"><a class="brand" href="index.html" style="color:inherit;text-decoration:none"><span class="brand-mark">V</span><div><h1>GRE Vocab Machine</h1><p>Vocabulary matching game</p></div></a><nav class="site-nav"><a href="index.html">Study</a><a href="review.html">Review</a><a href="dashboard.html">Dashboard</a><a href="game.html">Game</a></nav><div class="top-actions"><div id="account-menu-wrap" style="position:relative"><button id="account-button" class="button-secondary account-button" type="button">Sign in</button><div id="account-menu" class="feature-card" style="display:none;position:absolute;right:0;top:calc(100% + 8px);z-index:5;min-width:150px;padding:12px"><button id="sign-out-button" class="button-secondary" type="button">Sign out</button></div></div><button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Switch to dark mode" title="Switch to dark mode"><span class="theme-toggle-track" aria-hidden="true"><span class="theme-icon theme-icon-sun"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg></span><span class="theme-toggle-thumb"></span><span class="theme-icon theme-icon-moon"><svg viewBox="0 0 24 24"><path d="M20.2 15.4A8.5 8.5 0 0 1 8.6 3.8 8.5 8.5 0 1 0 20.2 15.4Z"></path></svg></span></span></button></div></header>
<section class="feature-page"><div class="feature-header"><div><h2>Word match</h2><p>Choose a word with a similar meaning. Scores are saved to your account.</p></div><a class="button-secondary" href="index.html">Back to flashcards</a></div><div id="game-content"><div class="feature-empty"><h3>Ready to test your vocabulary?</h3><p>Sign in to play and save your scores.</p><div class="feature-actions" style="justify-content:center"><a class="button-primary" href="index.html?auth=login">Sign in</a><a href="index.html?auth=register">Create account</a></div></div></div></section></main>
<script>
(async()=>{const root=document.querySelector('#game-content');const req=async(url,options={})=>{const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||'Request failed'),{status:r.status});return d;};let me;try{me=await req('/api/me');}catch(e){root.innerHTML='<div class="feature-empty"><h3>Server unavailable</h3><p>'+e.message+'</p></div>';return;}if(!me.user)return;let game=null,index=0,answers=[];const start=async()=>{root.innerHTML='<div class="feature-empty"><h3>Preparing questions…</h3></div>';try{game=await req('/api/game/start',{method:'POST',body:JSON.stringify({questionCount:10})});index=0;answers=[];renderQuestion();}catch(e){root.innerHTML='<div class="feature-empty"><h3>Could not start the game</h3><p>'+e.message+'</p><div class="feature-actions" style="justify-content:center"><button id="retry">Try again</button></div></div>';document.querySelector('#retry').onclick=start;}};function renderQuestion(){const q=game.questions[index];root.replaceChildren();const card=document.createElement('article');card.className='feature-card';const progress=document.createElement('p');progress.className='feature-muted';progress.textContent='Question '+(index+1)+' of '+game.questions.length;const h=document.createElement('h3');h.className='feature-word';h.style.fontSize='clamp(30px,5vw,46px)';h.textContent=q.word;const hint=document.createElement('p');hint.className='feature-muted';hint.textContent='Select the word closest in meaning.';const options=document.createElement('div');options.className='game-options';q.options.forEach((o,i)=>{const b=document.createElement('button');b.className='game-option';b.textContent=String.fromCharCode(65+i)+'. '+o.word;b.onclick=()=>choose(q,o,b,options);options.append(b);});card.append(progress,h,hint,options);root.append(card);}async function choose(q,o,button,options){if(answers.some(a=>a.questionId===q.questionId))return;answers.push({questionId:q.questionId,wordId:o.wordId});[...options.children].forEach(b=>b.disabled=true);button.classList.add('is-selected');const feedback=document.createElement('p');feedback.className='feature-muted';try{const result=await req('/api/game/answer',{method:'POST',body:JSON.stringify({gameId:game.gameId,questionId:q.questionId,wordId:o.wordId})});feedback.textContent=result.correct?'Correct!':'Not quite. A correct match is '+result.answerWord+'.';feedback.style.color=result.correct?'#39815d':'#bd4139';if(!result.correct)button.classList.add('is-wrong');else button.classList.add('is-correct');}catch(e){feedback.textContent=e.message;}options.parentElement.append(feedback);const next=document.createElement('div');next.className='feature-actions';const b=document.createElement('button');b.className='button-primary';b.textContent=index===game.questions.length-1?'See results':'Next question';b.onclick=()=>{index++;if(index<game.questions.length)renderQuestion();else finish();};next.append(b);options.parentElement.append(next);}async function finish(){root.innerHTML='<div class="feature-empty"><h3>Calculating your score…</h3></div>';try{const result=await req('/api/game/finish',{method:'POST',body:JSON.stringify({gameId:game.gameId,answers})});root.innerHTML='<article class="feature-card" style="text-align:center;padding:32px 18px"><p class="feature-muted">GAME COMPLETE</p><h2 style="font-size:44px;margin:8px 0">'+result.score+' points</h2><p class="feature-muted">'+result.correct+' of '+result.totalQuestions+' correct · '+result.accuracy+'% accuracy</p><p class="feature-muted">Time: '+result.durationSeconds+' seconds. Your score has been saved.</p><div class="feature-actions" style="justify-content:center"><button class="button-primary" id="play-again">Play again</button><a href="dashboard.html">View dashboard</a></div></article>';document.querySelector('#play-again').onclick=start;}catch(e){root.innerHTML='<div class="feature-empty"><h3>Could not save score</h3><p>'+e.message+'</p><button id="retry-finish">Try again</button></div>';document.querySelector('#retry-finish').onclick=finish;}}const startCard=document.createElement('article');startCard.className='feature-card';startCard.innerHTML='<h3 style="margin-top:0">Ready?</h3><p class="feature-muted">10 questions · 100 points per correct answer · no penalty for mistakes.</p><div class="feature-actions"><button class="button-primary" id="start-game">Start game</button></div>';root.replaceChildren(startCard);document.querySelector('#start-game').onclick=start;})();
</script><script>
(async()=>{const button=document.getElementById('account-button'),menu=document.getElementById('account-menu'),logout=document.getElementById('sign-out-button');const req=async(url,options={})=>{const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d};try{const me=await req('/api/me');if(me.user){button.textContent=me.user.username||me.user.email;button.title='Account options';button.onclick=()=>{menu.style.display=menu.style.display==='block'?'none':'block'};logout.onclick=async()=>{try{await req('/api/auth/logout',{method:'POST',body:'{}'})}finally{location.reload()}}}else{button.textContent='Sign in';button.onclick=()=>location.href='index.html?auth=login';menu.remove()}}catch{button.textContent='Sign in';button.onclick=()=>location.href='index.html?auth=login';menu.remove()}
const toggle=document.getElementById('theme-toggle');function applyTheme(theme,persist=true){document.documentElement.dataset.theme=theme;const dark=theme==='dark';toggle.setAttribute('aria-checked',String(dark));toggle.setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode');toggle.title=dark?'Switch to light mode':'Switch to dark mode';const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=dark?'#171818':'#f1ece0';if(persist){let ui={};try{ui=JSON.parse(localStorage.getItem('vocabularyLearner.ui.v1')||'{}')}catch{}localStorage.setItem('vocabularyLearner.ui.v1',JSON.stringify({...ui,theme}))}}applyTheme(document.documentElement.dataset.theme||'light',false);toggle.addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));
})();
</script><script>(()=>{if(window.matchMedia?.("(pointer: coarse)").matches)return;let raf=0,x=window.innerWidth*0.5,y=window.innerHeight*0.2;const update=()=>{document.documentElement.style.setProperty("--cursor-x",x+"px");document.documentElement.style.setProperty("--cursor-y",y+"px");document.body.classList.add("cursor-glow-visible");raf=0};window.addEventListener("pointermove",e=>{x=e.clientX;y=e.clientY;if(!raf)raf=requestAnimationFrame(update)},{passive:true});window.addEventListener("pointerleave",()=>{document.body.classList.remove("cursor-glow-visible")})})();</script></body></html>

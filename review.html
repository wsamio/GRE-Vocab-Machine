<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f7f5">
<script>(()=>{try{const ui=JSON.parse(localStorage.getItem("vocabularyLearner.ui.v1")||"{}");document.documentElement.dataset.theme=ui.theme==="dark"?"dark":"light"}catch{document.documentElement.dataset.theme="light"}})();</script><title>Review Words · GRE Vocab Machine</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app-shell">
<header class="topbar"><a class="brand" href="index.html" style="color:inherit;text-decoration:none"><span class="brand-mark">V</span><div><h1>GRE Vocab Machine</h1><p>Review workspace</p></div></a><nav class="site-nav"><a href="index.html">Study</a><a href="review.html">Review</a><a href="dashboard.html">Dashboard</a><a href="game.html">Game</a></nav><div class="top-actions"><div id="account-menu-wrap" style="position:relative"><button id="account-button" class="button-secondary account-button" type="button">Sign in</button><div id="account-menu" class="feature-card" style="display:none;position:absolute;right:0;top:calc(100% + 8px);z-index:5;min-width:150px;padding:12px"><button id="sign-out-button" class="button-secondary" type="button">Sign out</button></div></div><button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Switch to dark mode" title="Switch to dark mode"><span class="theme-toggle-track" aria-hidden="true"><span class="theme-icon theme-icon-sun"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg></span><span class="theme-toggle-thumb"></span><span class="theme-icon theme-icon-moon"><svg viewBox="0 0 24 24"><path d="M20.2 15.4A8.5 8.5 0 0 1 8.6 3.8 8.5 8.5 0 1 0 20.2 15.4Z"></path></svg></span></span></button></div></header>
<section class="feature-page"><div class="feature-header"><div><h2>Words in review</h2><p>All words marked for review, kept in the original dictionary order.</p></div><a class="button-secondary" href="index.html">Back to flashcards</a></div><p id="review-count" class="feature-muted">Loading your review list…</p><div id="review-list"></div></section>
</main><script>
(async()=>{const list=document.querySelector('#review-list'),count=document.querySelector('#review-count');const req=async(url,options={})=>{const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||'Request failed'),{status:r.status});return d;};try{const me=await req('/api/me');if(!me.user){list.innerHTML='<div class="feature-empty"><h3>Sign in to see your review words</h3><p>Your review list is private to your account.</p><div class="feature-actions" style="justify-content:center"><a class="button-primary" href="index.html?auth=login">Sign in</a><a href="index.html?auth=register">Create account</a></div></div>';count.textContent='Your personal review list';return;}const data=await req('/api/review');count.textContent=data.words.length+' word'+(data.words.length===1?'':'s')+' to review';if(!data.words.length){list.innerHTML='<div class="feature-empty"><h3>No words are in review</h3><p>Words you mark red on the flashcards will appear here.</p><div class="feature-actions" style="justify-content:center"><a href="index.html">Continue studying</a></div></div>';return;}list.replaceChildren(...data.words.map((w,i)=>{const card=document.createElement('article');card.className='feature-card';const title=document.createElement('div');title.className='feature-word';title.textContent=(i+1)+'. '+w.word;const def=document.createElement('p');def.className='feature-muted';def.textContent=w.definition||'No definition available.';const meta=document.createElement('p');meta.className='feature-muted';meta.textContent='Day '+w.dayNumber+(w.synonyms?' · Synonyms: '+w.synonyms:'');const actions=document.createElement('div');actions.className='feature-actions';const learned=document.createElement('button');learned.className='button-primary';learned.textContent='Mark learned';learned.addEventListener('click',async()=>{learned.disabled=true;try{await req('/api/progress/'+encodeURIComponent(w.wordId),{method:'PUT',body:JSON.stringify({status:'green'})});card.remove();count.textContent=(list.querySelectorAll('.feature-card').length)+' words to review';if(!list.querySelector('.feature-card'))list.innerHTML='<div class="feature-empty"><h3>No words are in review</h3><p>You have cleared your current review list.</p></div>';}catch(e){alert(e.message);learned.disabled=false;}});const study=document.createElement('a');study.href='index.html';study.textContent='Open flashcards';actions.append(learned,study);card.append(title,def,meta,actions);return card;}));}catch(e){count.textContent='Could not load your review list.';list.innerHTML='<div class="feature-empty"><h3>Something went wrong</h3><p>'+e.message+'</p><a href="index.html">Return to study</a></div>';}})();
</script><script>
(async()=>{const button=document.getElementById('account-button'),menu=document.getElementById('account-menu'),logout=document.getElementById('sign-out-button');const req=async(url,options={})=>{const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d};try{const me=await req('/api/me');if(me.user){button.textContent=me.user.username||me.user.email;button.title='Account options';button.onclick=()=>{menu.style.display=menu.style.display==='block'?'none':'block'};logout.onclick=async()=>{try{await req('/api/auth/logout',{method:'POST',body:'{}'})}finally{location.reload()}}}else{button.textContent='Sign in';button.onclick=()=>location.href='index.html?auth=login';menu.remove()}}catch{button.textContent='Sign in';button.onclick=()=>location.href='index.html?auth=login';menu.remove()}
const toggle=document.getElementById('theme-toggle');function applyTheme(theme,persist=true){document.documentElement.dataset.theme=theme;const dark=theme==='dark';toggle.setAttribute('aria-checked',String(dark));toggle.setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode');toggle.title=dark?'Switch to light mode':'Switch to dark mode';const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=dark?'#171818':'#f7f7f5';if(persist){let ui={};try{ui=JSON.parse(localStorage.getItem('vocabularyLearner.ui.v1')||'{}')}catch{}localStorage.setItem('vocabularyLearner.ui.v1',JSON.stringify({...ui,theme}))}}applyTheme(document.documentElement.dataset.theme||'light',false);toggle.addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));
})();
</script></body></html>
